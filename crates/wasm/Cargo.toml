[package]
name = "platersol-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Raw FFI WebAssembly bindings for the platersol plate solver (no wasm-bindgen)"

[lib]
name = "platersol_wasm"
crate-type = ["cdylib", "rlib"]

[dependencies]
platersol-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
